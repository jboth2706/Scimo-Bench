[workspace]
name = "scimo-bench"
channels = ["conda-forge"]
platforms = [
    "linux-64",
    "osx-arm64",
    { name = "linux-64-cuda", platform = "linux-64", cuda = "12" },
]

[dependencies]
python = "3.12.*"
numpy = ">=1.26,<3"
pandas = ">=2.0"
pyarrow = ">=15"
awkward = ">=2.0"
uproot = ">=5.0"
scipy = ">=1.11"
matplotlib = ">=3.8,<4"
hydra-core = ">=1.3.2,<2"
hydra-zen = ">=0.12"
pot = ">=0.9"
pytest = ">=8.0,<9"
ruff = ">=0.5"

[tasks]
test = { cmd = "pytest", env = { OPENBLAS_NUM_THREADS = "1", OMP_NUM_THREADS = "1" } }
# the suite as a CPU job of a site profile: `pixi run test-job raven`
test-job = { cmd = "python -m scimo_bench.jobs {{ site }} -- pytest", args = ["site"] }
lint = "ruff check . && ruff format --check ."
fmt = "ruff format . && ruff check --fix ."

# Perf path (M6): torch + the producers' model code, only for adapters (stage=perf).
# Versions follow hep4m_scimo's environment; its packages are editable sibling checkouts.
# Install on a login node with CONDA_OVERRIDE_CUDA=12.9 pixi install -e perf; runs as a GPU job
# (`site=raven stage=perf`).
[feature.perf]
platforms = ["linux-64-cuda", "osx-arm64"]

[feature.perf.dependencies]
numpy = ">=1.26,<2"
lightning = ">=2.5.5,<3"
torchmetrics = ">=1.0,<2"
h5py = ">=3.13,<4"
rich = ">=14.0,<15"

[feature.perf.target.linux-64-cuda.dependencies]
pytorch = { version = "2.9.*", build = "cuda*" }
cuda-cudart-dev = "12.9.*"

[feature.perf.target.osx-arm64.dependencies]
pytorch = "2.9.*"

[feature.perf.pypi-dependencies]
hep4m-scimo = { path = "../scimo", editable = true }
scimo = { path = "../scimo-framework", editable = true }

[environments]
perf = ["perf"]
